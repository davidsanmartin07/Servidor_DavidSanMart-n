<html>
    <head>
        
        <title>Examen de Desarrollo web en entorno servidor</title>
        <link rel="stylesheet" type="text/css" href="../estilos/estilos.css">
        <link rel="icon" type="image/png" sizes="32x32" href="../imagenes/favicon.jpeg">
    </head>
    <body>
        <h1>Centro de Ayuda al Empleo</h1>
        <h2>Formulario de solicitud</h2>
        <button onclick="location.href='../php/tabla.php?tipo=soldadura'">Soldadura</button>
        <button onclick="location.href='../php/tabla.php?tipo=informatica'">Informática</button>
        <button onclick="location.href='../php/tabla.php?tipo=socio'">Asistencia Sociosanitaria</button>
        <form action="../php/tabla.php" method="post">
            <!-- Añade aquí todos los datos que te pido en el enunciado -->
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" required><br>

            <label for="apellidos">Apellidos:</label>
            <input type="text" id="apellidos" name="apellidos" required>

            <label for="DNI">DNI:</label>
            <input type="text" id="DNI" name="DNI" required onblur="comprobarDNI(this)">

            <label for="fecha_Nacimiento">Fecha de Nacimiento:</label>
            <input type="date" id="fecha_Nacimiento" name="fecha_Nacimiento" required>

            <label for="direccion">El teléfono no lleva prefijo ni el +, solo los 9 dígitos:(debes poner los 9 dígitos sin espacios ni guiones).</label>
            <label for="telefono">Teléfono:</label>
            <input type="tel" id="telefono" name="telefono" required pattern="[0-9]{9}" title="El teléfono debe tener 9 dígitos">

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required
            pattern="[^@\s]+@[^@\s]+\.[^@\s]+"
            title="El email debe llevar @ y un punto después, por ejemplo nombre@correo.com">

            <label for="Curso">Profesión:</label>
            <select id="Curso" name="tipo" required>
                <option value="soldadura">Soldadura</option>
                <option value="informatica">Informática</option>
                <option value="socio">Asistencia Sociosanitaria</option>
            </select>
            <br>
            <label>Jornada:</label>
            <label for="jornada_completa">Completa</label>
            <input type="radio" id="jornada_completa" name="jornada" value="completa">
            <label for="jornada_parcial">Parcial</label>
            <input type="radio" id="jornada_parcial" name="jornada" value="parcial">
            <br><br>
            <label>Idioma/as:</label>
            <label for="ingles">Inglés</label>
            <input type="checkbox" id="ingles" name="idioma[]" value="ingles">
            <label for="euskera">Euskera</label>
            <input type="checkbox" id="euskera" name="idioma[]" value="euskera">
            <br><br>
            <input type="submit" value="Enviar">
        </form>
        <script>
            function comprobarDNI(campo) {
                var letras = "TRWAGMYFPDXBNJZSQVHLCKE";
                var dni = campo.value.toUpperCase();
                var numeros = dni.substring(0, 8);
                var letra = dni.substring(8, 9);
                var letraCorrecta = letras[numeros % 23];

                if (dni.length != 9) {
                    campo.setCustomValidity("El DNI debe tener 9 caracteres");
                } else if (isNaN(numeros)) {
                    campo.setCustomValidity("Los 8 primeros caracteres deben ser números");
                } else if (letra != letraCorrecta) {
                    campo.setCustomValidity("La letra no es correcta");
                } else {
                    campo.setCustomValidity("");
                }
            }
        </script>
    </body>
</html>
