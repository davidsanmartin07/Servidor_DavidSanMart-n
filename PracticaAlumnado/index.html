<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Formulario</title>
    <link rel="stylesheet" href="estilos/style.css">
</head>
<body>
    <form action="PHP/formulario.php" method="post">

        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" required>
        <br><br>

        <label for="apellidos">Apellidos:</label>
        <input type="text" id="apellidos" name="apellidos" required>
        <br><br>
        <label for="fecha_nacimiento">Fecha de nacimiento:</label>
        <input type="date" id="fecha_nacimiento" name="fecha_nacimiento" required>
        <br><br>

        <label for="curso">Curso:</label>
        <select id="curso" name="curso" required>
            <option value="">-- Selecciona --</option>
            <option value="1">1º ESO</option>
            <option value="2">2º ESO</option>
            <option value="3">3º ESO</option>
            <option value="4">4º ESO</option>
        </select>
        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        <br><br>

        <label for="contrasena">Contraseña:</label>
        <input type="password" id="contrasena" name="contrasena" required>
        <br><br>

        <input type="submit" value="Enviar">

    </form>

    <!-- Botón aparte, solo para ir al listado -->
    <form action="PHP/listar.php" method="get" class="form-listar">
        <input type="submit" value="Listar">
    </form>
</body>
</html>
